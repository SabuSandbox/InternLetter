<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl Global - Internship Letter Generator</title>
    
    <!-- Required Libraries for Word Document Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip-utils.js"></script>

    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0;
            background-color: #050505; 
            background-image: radial-gradient(circle at 50% 50%, #110a1f 0%, #050505 100%);
            color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .glow-wrapper {
            position: relative; width: 100%; max-width: 800px; border-radius: 16px; z-index: 1;
        }
        .glow-wrapper::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, #2e7d32 0%, #1565c0 40%, transparent 80%); /* Pearl Global brand colors */
            border-radius: 18px; z-index: -1; filter: blur(8px); opacity: 0.8;
        }
        .card-content {
            background: #0f0a18; border-radius: 16px; padding: 40px 50px;
            border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .form-header { text-align: center; margin-bottom: 35px; }
        .form-header h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .form-header p { color: #aaa; font-size: 13px; margin: 0; } 
        
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        
        label { display: block; font-weight: 400; margin-bottom: 8px; font-size: 12px; color: #ccc; } 
        input[type="text"] { 
            width: 100%; padding: 12px 14px; background: rgba(255, 255, 255, 0.07); 
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; 
            box-sizing: border-box; font-size: 13px; color: #ffffff; outline: none; transition: all 0.2s ease;
        }
        input::placeholder { color: #888; } 
        input:focus { border-color: #1565c0; background: rgba(255, 255, 255, 0.1); }
        
        button { 
            border: none; padding: 14px; cursor: pointer; border-radius: 8px; 
            font-weight: 500; font-size: 15px; transition: opacity 0.2s, transform 0.1s; width: 100%;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: #ffffff; color: #000000; margin-top: 20px; font-weight: 600; }
        .btn-primary:hover { background: #e0e0e0; }
        
        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 15px; }
            .card-content { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="glow-wrapper">
    <div class="card-content">
        <div class="form-header">
            <h2>Internship Letter Generator</h2>
            <p>Enter details below to generate the Word document automatically.</p>
        </div>

        <form id="letter-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Letter Date</label>
                    <input type="text" id="letterDate" placeholder="e.g., 30th July, 2026" required>
                </div>
                <div class="form-group">
                    <label>Intern Name</label>
                    <input type="text" id="internName" placeholder="e.g., Abdul Ghani" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="department" placeholder="e.g., IT Department" value="IT Department">
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" id="position" placeholder="e.g., Intern" value="Intern">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date of Joining</label>
                    <input type="text" id="joiningDate" placeholder="e.g., 3rd August 2026">
                </div>
                <div class="form-group">
                    <label>Tenure</label>
                    <input type="text" id="tenure" placeholder="e.g., 4 months" value="4 months">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Reporting To</label>
                    <input type="text" id="reportingTo" placeholder="e.g., Mr. Gurdeep">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" value="Plot No 51, Sector-32, Gurugram, Haryana">
                </div>
            </div>
            
            <button type="button" class="btn-primary" onclick="generateWordDoc()">Download Word Document</button>
        </form>
    </div>
</div>

<script>
    // Automatically set today's date on load
    document.addEventListener("DOMContentLoaded", () => {
        const today = new Date();
        const formattedDate = today.toLocaleDateString('en-GB', { 
            day: 'numeric', month: 'long', year: 'numeric' 
        });
        
        // Add ordinal suffix (st, nd, rd, th) to the day
        const day = today.getDate();
        const suffix = (day % 10 === 1 && day !== 11) ? 'st' :
                       (day % 10 === 2 && day !== 12) ? 'nd' :
                       (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
        
        const month = today.toLocaleString('default', { month: 'long' });
        const year = today.getFullYear();
        
        document.getElementById('letterDate').value = `${day}${suffix} ${month}, ${year}`;
    });

    // Helper function to load the local Word template
    function loadFile(url, callback) {
        PizZipUtils.getBinaryContent(url, callback);
    }

    function generateWordDoc() {
        // 1. Gather all data from the form matching the tags in your template
        const templateData = {
            letterDate: document.getElementById('letterDate').value,
            internName: document.getElementById('internName').value,
            department: document.getElementById('department').value,
            position: document.getElementById('position').value,
            joiningDate: document.getElementById('joiningDate').value,
            tenure: document.getElementById('tenure').value,
            location: document.getElementById('location').value,
            reportingTo: document.getElementById('reportingTo').value
        };

        // 2. Load the specific template file you referenced
        loadFile("letter_template.docx", function(error, content) {
            if (error) { 
                alert("Error: Could not load 'letter_template.docx'. Make sure it is in the same folder and you are running this on a local web server (not just double-clicking the HTML file).");
                throw error; 
            }
            
            // 3. Unzip the content and initialize docxtemplater
            var zip = new PizZip(content);
            var doc = new window.docxtemplater(zip, { 
                paragraphLoop: true, 
                linebreaks: true 
            });

            // 4. Inject the data into the {tags}
            try {
                doc.render(templateData);
            } catch (error) {
                console.error("Error during rendering:", error);
                alert("An error occurred mapping the data. Check your template tags.");
                return;
            }

            // 5. Generate and download the filled document
            var out = doc.getZip().generate({ 
                type: "blob", 
                mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" 
            });
            
            // Format the downloaded file name dynamically based on intern name
            const sanitizedName = templateData.internName.replace(/[^a-zA-Z0-9]/g, '_') || 'Intern';
            const fileName = `Internship_Letter_${sanitizedName}.docx`;
            saveAs(out, fileName);
        });
    }
</script>
</body>
</html>
